[package]
name = "device-pairing"
version = "0.1.0"
description = "Pair two devices with a short code: one-shot windows, SPAKE2 bound to device identities, SAS, a MAC'd trust store, and an optional iroh transport."
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/dragos-catalin/device-pairing"
keywords = ["pairing", "spake2", "pake", "iroh", "sas"]
categories = ["cryptography", "network-programming"]
exclude = ["ts/", ".github/", ".copilot-tmp/"]

[features]
default = []
iroh = ["dep:iroh", "dep:tokio"]

[dependencies]
blake3 = "1.8.7"
data-encoding = "2.11.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spake2 = "0.4.0"
thiserror = "2.0.21"
zeroize = { version = "1.9.0", features = ["derive"] }
iroh = { version = "1.2.0", default-features = false, features = ["tls-ring"], optional = true }
tokio = { version = "1.53.1", features = ["io-util"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[test]]
name = "iroh_pairing"
required-features = ["iroh"]
