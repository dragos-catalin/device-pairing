name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  schedule:
    - cron: "37 3 * * 1" # weekly full-history secret scan + fresh CVE data
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --features iroh --locked -- -D warnings
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --features iroh --locked
  ts:
    uses: dragos-catalin/workflows/.github/workflows/node-ci.yml@v1
    with:
      working-directory: ts
      tasks: lint typecheck test build
      extra: pnpm audit --audit-level high
  security:
    uses: dragos-catalin/workflows/.github/workflows/security.yml@v1
    with:
      full-history: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
