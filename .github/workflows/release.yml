name: Release

# On a v* tag: publish the crate to crates.io and @codai/device-pairing to npm, both with
# trusted publishing (OIDC), no stored tokens. One-time prerequisites, after the first
# manual publish of each package by the owner:
#   crates.io: crate device-pairing -> Settings -> Trusted Publishing -> GitHub,
#              repo dragos-catalin/device-pairing, workflow release.yml.
#   npmjs.com: package @codai/device-pairing -> Settings -> Trusted publishing ->
#              GitHub Actions, repo dragos-catalin/device-pairing, workflow release.yml.
#
# The workspace also holds ffi/ (device-pairing-ffi, publish = false): only the core crate
# is published here. Shipping the Kotlin bindings as an AAR / Maven artifact is a follow-up.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  crate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Tag matches Cargo.toml
        run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "device-pairing") | .version')" = "${GITHUB_REF_NAME}"
      - run: cargo test -p device-pairing --features iroh --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish -p device-pairing --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ts/.nvmrc
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5 (trusted publishing)
        run: npm i -g npm@latest && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: npm publish --access public --provenance

  release:
    needs: [crate, npm]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
